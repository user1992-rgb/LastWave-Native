name: Personal debug APK

# Builds an installable debug APK on a personal fork, with no signing secrets.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Radio tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --tests 'com.lastwave.app.playback.AnchoredRadioTest' --tests 'com.lastwave.app.playback.PureRadioQueueTest'

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-personal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
